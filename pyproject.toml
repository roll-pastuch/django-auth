[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "roll-pastuch-django-auth"
version = "0.2.0"
description = "Roll Pastuch platform identity for Django applications"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Authlib>=1.6,<2",
    "Django>=5.2,<6",
    "inertia-django>=2,<3",
]

[tool.setuptools.packages.find]
where = ["src"]
